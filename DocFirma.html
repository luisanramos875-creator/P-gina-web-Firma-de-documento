<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Firma Digital</title>

    <link rel="stylesheet" href="estilos.css">

    <!-- PDF-LIB -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

    <!-- PDF.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

</head>

<body>

    <div class="contenedor">

        <!-- MENÚ -->
        <div id="menuPrincipal">

            <h1>Menú Principal</h1>

            <div class="menu">

                <button onclick="abrirOpcion('firmar')">

                    Firmar Documento

                </button>

                <button onclick="abrirOpcion('crear')">

                    Crear Firma

                </button>

            </div>

        </div>

        <!-- ================================= -->
        <!-- OPCIÓN FIRMAR -->
        <!-- ================================= -->

        <div
            id="opcionFirmar"
            style="display: none;"
        >

            <button
                class="volver"
                onclick="volverMenu()"
            >

                ← Volver al menú

            </button>

            <h1>Firmar Documento</h1>

            <!-- PDF -->
            <input
                type="file"
                id="archivoPDF"
                accept=".pdf"
            >

            <!-- BUSCAR -->
            <input
                type="text"
                id="buscarFirma"
                placeholder="Buscar usuario"
                onkeyup="buscarFirmas()"
            >

            <!-- RESULTADOS -->
            <div id="resultadoBusqueda"></div>

            <!-- BOTÓN -->
            <button onclick="firmarDocumento()">

                Firmar Documento

            </button>

            <p id="mensajep1"></p>

        </div>

        <!-- ================================= -->
        <!-- OPCIÓN CREAR -->
        <!-- ================================= -->

        <div
            id="opcionCrear"
            style="display: none;"
        >

            <button
                class="volver"
                onclick="volverMenu()"
            >

                ← Volver al menú

            </button>

            <h1>Crear Firma</h1>

            <!-- NOMBRE -->
            <input
                type="text"
                id="nombreUsuario"
                placeholder="Ingrese su nombre"
            >

            <!-- CANVAS -->
            <canvas id="canvasFirma"></canvas>

            <!-- BOTONES -->
            <div class="botonesFirma">

                <button onclick="limpiarCanvas()">

                    Limpiar Firma

                </button>

                <button onclick="guardarFirma()">

                    Guardar Firma

                </button>

            </div>

            <p id="mensaje"></p>

        </div>

    </div>

    <!-- TU JS -->
    <script src="firmas.js/firma.js"></script>

</body>

</html>
